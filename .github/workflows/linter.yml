name: Go CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.24.4

      - name: Setup TDLib CGO headers and dynamic stub
        run: |
          sudo mkdir -p /usr/local/include/td/telegram
          sudo tee /usr/local/include/td/telegram/td_json_client.h << 'CHEADER'
          #ifndef TD_JSON_CLIENT_H
          #define TD_JSON_CLIENT_H
          #ifdef __cplusplus
          extern "C" {
          #endif
          int td_create_client_id(void);
          void td_send(int client_id, const char* request);
          const char* td_receive(double timeout);
          const char* td_execute(const char* request);
          typedef void (*td_log_message_callback_ptr)(int, const char*);
          void td_set_log_message_callback(int max_verbosity_level, td_log_message_callback_ptr callback);
          #ifdef __cplusplus
          }
          #endif
          #endif
          CHEADER
          echo 'int td_create_client_id(void){return 1;} void td_send(int c, const char* r){} const char* td_receive(double t){return 0;} const char* td_execute(const char* r){return 0;} void td_set_log_message_callback(int v, void (*cb)(int, const char*)){}' | sudo gcc -shared -fPIC -x c - -o /usr/local/lib/libtdjson.so
          sudo ldconfig

      - name: Golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          args: --build-tags=libtdjson
