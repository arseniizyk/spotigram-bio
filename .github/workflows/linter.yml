name: Go CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.24.4

      - name: Install CGO dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends libssl-dev zlib1g-dev

      - name: Golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
